<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à jour système...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #ff3333;
            font-weight: bold;
            z-index: 10;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <canvas id="glitchCanvas"></canvas>
    <div id="text">⚠️ CHARGEMENT DU MODULE... <span id="timer">45</span>s</div>

    <script>
        const canvas = document.getElementById('glitchCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const cols = 40;
        const rows = 40;
        let grid = Array(cols).fill(0).map(() => Array(rows).fill(false));
        grid[Math.floor(cols/2)][Math.floor(rows/2)] = true;

        function updateBlob() {
            let newGrid = grid.map(arr => [...arr]);
            for(let x = 0; x < cols; x++) {
                for(let y = 0; y < rows; y++) {
                    if(grid[x][y]) {
                        const neighbors = [
                            [x+1, y], [x-1, y], [x, y+1], [x, y-1],
                            [x+1, y+1], [x-1, y-1]
                        ];
                        neighbors.forEach(([nx, ny]) => {
                            if(nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                                if(Math.random() < 0.15) {
                                    newGrid[nx][ny] = true;
                                }
                            }
                        });
                    }
                }
            }
            grid = newGrid;
        }

        setInterval(updateBlob, 150);

        function draw() {
            // Fond noir profond au lieu de blanc pour faire plus réaliste
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cellW = canvas.width / cols;
            const cellH = canvas.height / rows;

            const colors = ['#000000', '#111111', '#222222', '#ff0000', '#990000', '#330000'];

            for(let x = 0; x < cols; x++) {
                for(let y = 0; y < rows; y++) {
                    if(grid[x][y]) {
                        if(Math.random() < 0.8) {
                            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                            ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
                        }
                    } else if(Math.random() < 0.03) {
                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(x * cellW, y * cellH, cellW * (1 + Math.random()*2), cellH / 2);
                    }
                }
            }
            requestAnimationFrame(draw);
        }
        draw();

        let timeLeft = 45;
        let timerElem = document.getElementById('timer');
        let interval = setInterval(() => {
            timeLeft--;
            if(timerElem) timerElem.innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(interval);
                document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;background:#000;'><h1 style='color:#00ff00;font-size:3rem;text-align:center;'>C'était une blague ! 😂</h1></div>";
            }
        }, 1000);
    </script>
</body>
</html>
