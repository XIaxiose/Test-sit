<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Erreur système - 45s</title>
    <style>
        body { background: #000; color: #ff3333; font-family: monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        h1 { font-size: 2rem; }
        p { font-size: 1.2rem; color: #fff; }
    </style>
</head>
<body>
    <h1>⚠️ ERREUR CRITIQUE DU SYSTÈME ⚠️</h1>
    <p>Le système plante dans <span id="countdown">45</span> secondes...</p>
    <script>
        let timeLeft = 45;
        let timer = setInterval(function() {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.body.innerHTML = "<h1 style='color: #00ff00;'>C'était une blague, mon pote ! 😂</h1>";
            }
        }, 1000);
    </script>
</body>
</html>
